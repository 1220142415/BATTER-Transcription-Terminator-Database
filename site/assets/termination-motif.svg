<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" role="img" aria-labelledby="title desc">
  <title id="title">Intrinsic transcription termination</title>
  <desc id="desc">RNA stem-loop and U-rich tail, with the transcript 3′ end aligned to a schematic signal peak. An intrinsic termination example, not measured data.</desc>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#756774">
    <rect x="421" y="32" width="26" height="247" rx="13" fill="#faeee3"/>
    <path d="M434 37V279" fill="none" stroke="#bc885f" stroke-dasharray="3 5" opacity=".55"/>
    <text x="20" y="55" font-size="13" font-weight="700" letter-spacing="1">DNA</text>
    <path d="M91 50H488" fill="none" stroke="#e1d5de" stroke-width="2"/>
    <path d="M110 40H225L238 50L225 60H110Z" fill="#e4d5e1" stroke="#aa8ca1"/>
    <text x="110" y="25">Reference gene</text>
    <text x="324" y="25">Downstream region</text>

    <text x="20" y="187" font-size="13" font-weight="700" letter-spacing="1">RNA</text>
    <text x="79" y="187" fill="#4b2d47">5′</text>
    <path d="M104 182H259Q278 182 278 163V119C245 71 354 71 321 119V164Q321 182 340 182H432" fill="none" stroke="#834b75" stroke-width="4" stroke-linecap="round"/>
    <path d="M282 121H317M282 132H317M282 143H317M282 154H317M282 165H317" fill="none" stroke="#bd93af" stroke-width="3" stroke-linecap="round"/>
    <text x="132" y="159" font-size="18" font-weight="600" fill="#4b2d47">3′ stem-loop</text>
    <path d="M242 154H266" fill="none" stroke="#aa8ca1"/>
    <g font-size="17" font-weight="600" fill="#834b75">
      <text x="344" y="171">U</text><text x="365" y="171">U</text><text x="386" y="171">U</text><text x="407" y="171">U</text>
    </g>
    <text x="350" y="209">U-rich tail</text>
    <circle cx="434" cy="182" r="6" fill="#b26841" stroke="white" stroke-width="2"/>
    <text x="452" y="188" fill="#8d512f" font-size="18" font-weight="700">3′</text>

    <text x="20" y="252" font-size="13" font-weight="700">3′ END</text>
    <text x="20" y="269" font-size="13" font-weight="700">SIGNAL</text>
    <path d="M104 272H488" fill="none" stroke="#e7dce4"/>
    <path d="M104 272H172L180 268L188 272H281L291 267L301 272H397L411 263L422 248L434 224L446 257L457 270H488V272Z" fill="#ead7e4"/>
    <path d="M104 272H172L180 268L188 272H281L291 267L301 272H397L411 263L422 248L434 224L446 257L457 270H488" fill="none" stroke="#834b75" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="330" y="300" font-size="14" fill="#8d512f">Transcript-end enrichment</text>
  </g>
</svg>
