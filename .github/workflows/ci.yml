name: BTED validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HF_DATA_BASE_URL: https://huggingface.co/datasets/liurulong/terminator/resolve/90651318aedf5a5ca26b8308070927d36fd3d6c9/v0.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate source templates
        run: python3 scripts/validate_bted_templates.py
      - name: Validate v0.3.0 release and v0.2.0 archive
        run: python3 scripts/validate_bted_v0_3.py
      - name: Check repository layout and Markdown links
        run: |
          python3 scripts/validate_repo_layout.py
          python3 scripts/check_markdown_links.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: Check Python syntax
        run: python3 -m compileall -q scripts bted_pipeline
      - name: Check Worker and site JavaScript syntax
        run: |
          node --check prototype/accession-range/src/worker.js
          node --check site/assets/browser-wrapper.js
          node --check site/assets/site.js
      - name: Download the versioned JBrowse application archive
        run: gh release download preview-v0.2.0 --pattern 'BTED-v0.2.0-jbrowse-assets.tar.gz*' --dir "$RUNNER_TEMP"
      - name: Assemble Pages and Worker sites
        run: |
          python3 scripts/stage_site.py --mode pages --release-archive "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz" --release-sha256-file "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" --hf-data-base-url "$HF_DATA_BASE_URL" --output-dir "$RUNNER_TEMP/bted-pages"
          python3 scripts/stage_site.py --mode worker --release-archive "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz" --release-sha256-file "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" --hf-data-base-url "$HF_DATA_BASE_URL" --output-dir "$RUNNER_TEMP/bted-worker"
          python3 scripts/validate-site.py "$RUNNER_TEMP/bted-pages"
          python3 scripts/validate-site.py "$RUNNER_TEMP/bted-worker"
