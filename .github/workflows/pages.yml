name: Deploy BTED Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the JBrowse asset
        required: true
        default: preview-v0.2.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'preview-v0.2.0' }}
      GH_TOKEN: ${{ github.token }}
      HF_DATA_BASE_URL: https://huggingface.co/datasets/liurulong/terminator/resolve/90651318aedf5a5ca26b8308070927d36fd3d6c9/v0.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v0.3.0 release and repository layout
        run: |
          python3 scripts/validate_bted_v0_3.py
          python3 scripts/validate_repo_layout.py
          python3 scripts/check_markdown_links.py
      - name: Download versioned JBrowse asset
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "BTED-v0.2.0-jbrowse-assets.tar.gz" \
            --pattern "BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" \
            --dir "$RUNNER_TEMP"
      - name: Stage Pages artifact
        run: |
          python3 scripts/stage_site.py \
            --mode pages \
            --release-archive "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz" \
            --release-sha256-file "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" \
            --hf-data-base-url "$HF_DATA_BASE_URL" \
            --output-dir _site
          python3 scripts/validate-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
