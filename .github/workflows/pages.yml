name: Deploy BTED Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the JBrowse asset
        required: true
        default: preview-v0.2.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'preview-v0.2.0' }}
      GH_TOKEN: ${{ github.token }}
      HF_V04_DATA_BASE_URL: https://huggingface.co/datasets/liurulong/terminator/resolve/eea5b7225975b224a1c837f60c4fa10497fef022/v0.4.0
      PUBLISHED_DATA_COMMIT: 8132334474a70cc609261fb0dc05011fbfd9e8ef
      PUBLISHED_RELEASE_ROOT: dist/published-snapshot/data/public/v0.4.0
    steps:
      - uses: actions/checkout@v4
      # Keep website checksums aligned with HF until the pending metadata update is published.
      - name: Restore the published data snapshot
        run: |
          git fetch --depth=1 origin "$PUBLISHED_DATA_COMMIT"
          mkdir -p dist/published-snapshot
          git archive "$PUBLISHED_DATA_COMMIT" data/public/v0.4.0 | tar -x -C dist/published-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build BTED JBrowse plugin
        run: |
          npm ci --prefix jbrowse-plugin
          npm --prefix jbrowse-plugin run check
          npm --prefix jbrowse-plugin run build
      - name: Validate v0.4.0 release and repository layout
        run: |
          python3 scripts/validate_bted_v0_4.py
          python3 scripts/validate_repo_layout.py
          python3 scripts/check_markdown_links.py
          python3 -m unittest discover -s tests -p 'test*.py' -q
          node --check prototype/accession-range/src/worker.js
          node --check site/assets/genome-index.js
          node --check site/assets/genome-page.js
          python3 scripts/prepare_v04_reference.py --output-root dist/v04-browser-objects
          python3 scripts/build_v0_4_site.py --release-root "$PUBLISHED_RELEASE_ROOT" --output-root dist/v04-browser-objects
          python3 scripts/build_v04_asset_manifest.py --release-root "$PUBLISHED_RELEASE_ROOT" --revision eea5b7225975b224a1c837f60c4fa10497fef022 --output "$RUNNER_TEMP/browser_assets.tsv"
          cmp data/registry/browser_assets.v0.4.0.tsv "$RUNNER_TEMP/browser_assets.tsv"
      - name: Download versioned JBrowse asset
        run: |
          gh release download "$RELEASE_TAG" \
            --repo seu-yolo/BATTER-Transcription-Terminator-Database \
            --pattern "BTED-v0.2.0-jbrowse-assets.tar.gz" \
            --pattern "BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" \
            --dir "$RUNNER_TEMP"
      - name: Stage Pages artifact
        run: |
          python3 scripts/stage_site.py \
            --data-version v0.4.0 --mode pages \
            --release-root "$PUBLISHED_RELEASE_ROOT" \
            --release-archive "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz" \
            --release-sha256-file "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz.sha256" \
            --hf-v04-data-base-url "$HF_V04_DATA_BASE_URL" \
            --output-dir _site
          python3 scripts/validate-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
